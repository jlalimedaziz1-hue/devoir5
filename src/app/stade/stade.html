
<div class="container mt-5">
  <h2 class="text-center mb-4">Liste des Stades</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-striped text-center align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nom du Stade</th>
          <th>Ville</th>
          <th>Capacité</th>
          <th>Date de création</th>
          <th>Type de stade</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (stade of stades; track stade.idStade) {
          <tr>
            <td>{{ stade.idStade }}</td>
            <td>{{ stade.nomStade }}</td>
            <td>{{ stade.ville }}</td>
            <td>{{ stade.capacite }}</td>
            <td>{{ stade.dateCreation }}</td>
            <td>{{ stade.typeStade.nomCat }}</td>
            <td>
              <a
                [routerLink]="['/modifier-stade', stade.idStade]"
                class="btn btn-warning btn-sm me-2">
                Modifier
              </a>

              <button
                class="btn btn-danger btn-sm"
                (click)="supprimerStade(stade.idStade)">
                Supprimer
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
